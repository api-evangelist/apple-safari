generated: '2026-09-07'
method: probed
source: live HTTPS probes of every host in apis.yml plus the registrable domain and www
description: >-
  Probe of the five canonical /.well-known/ discovery documents across every host this
  record knows. One real document was served: apple.com and www.apple.com both return a
  valid RFC 9116 security.txt. developer.apple.com answers every /.well-known/ path with
  HTTP 300 and an 83 KB HTML page — a catch-all, not a document. webkit.org,
  docs.webkit.org and security.apple.com serve none of these paths.
hosts:
  - host: apple.com
    documents:
      - path: /.well-known/security.txt
        status: 200
        content_type: text/plain
        file: apple-safari-security.txt
      - path: /.well-known/openid-configuration
        status: 404
      - path: /.well-known/oauth-authorization-server
        status: 404
      - path: /.well-known/api-catalog
        status: 404
      - path: /.well-known/ai-plugin.json
        status: 404
  - host: www.apple.com
    documents:
