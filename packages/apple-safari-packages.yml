description: >-
  First-party client distribution for the Safari developer surface. Apple ships almost
  nothing for Safari through a public package registry: the browser-facing APIs
  (Web Extensions, WebKit, SafariServices, Web Push, WebAuthn, Payment Request) are
  platform APIs already present in Safari, and the developer tooling is bundled inside
  Safari, Safari Technology Preview and Xcode rather than published to npm, PyPI or
  Homebrew. The one first-party JavaScript library Apple distributes for the web is the
  Apple Pay SDK, served unversioned from Apple's own CDN.
