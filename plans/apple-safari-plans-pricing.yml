description: >-
  Published pricing for access to the Safari developer surface. This file replaces a
  2026-05-04 bulk-sweep scaffold that invented free/professional/enterprise API tiers
  with per-request quotas and TBD overage pricing. Apple sells no metered API plan for
  Safari. Safari itself is free, and every Safari web API — Web Extensions, WebKit, Web
  Push, WebAuthn/passkeys, Payment Request, Web Inspector, the Safari MCP server — is
  usable at no cost with no API key. The only money on this surface is the Apple
  Developer Program membership, which gates App Store distribution and signing rather
  than API calls.
supersedes:
  method: generated
  note: >-
    Prior revision was a fabricated scaffold from the 2026-05-04 bulk sweep (roadmap#35),
    asserting three metered tiers Apple has never offered. Removed 2026-09-07.
plan_count: 3
metered_api_pricing: false
plans:
  - id: apple-safari-free-developer-account
    name: Apple Developer account
    type: free
    price: '0.00'
    currency: USD
    billing_period: none
    url: https://developer.apple.com/programs/
    description: >-
      Free Apple Developer account. Sufficient for essentially all Safari web
      development: building and testing web extensions locally, Web Inspector,
      safaridriver and the Safari MCP server, and Web Push.
    includes:
      - Access to beta versions of Xcode and operating systems
      - Test apps directly on your own devices using Xcode
      - Apple Developer Forums
      - Bug reporting with Feedback Assistant
      - Meet with Apple online events
    limits: []
    note: >-
      Apple states explicitly for web push: "You don't need to join the Apple Developer
      Program to send web push notifications."
      (https://developer.apple.com/documentation/usernotifications/sending-web-push-notifications-in-web-apps-and-browsers)
  - id: apple-developer-program
    name: Apple Developer Program
    type: paid
    price: '99.00'
    currency: USD
    billing_period: year
    url: https://developer.apple.com/programs/
    description: >-
      Annual membership. Required for the Safari surfaces that involve distribution or
      signed identity — packaging and distributing Safari web extensions and Safari app
      extensions through App Store Connect, and obtaining the Apple Pay merchant identity
      certificate used for merchant validation.
    includes:
      - Everything in the free Apple Developer account
      - TestFlight beta distribution
      - Distribution of apps and digital goods on Apple platforms
      - App analytics and sales reports
      - App Store marketing tools
      - Code-level technical support from Apple experts
    limits: []
  - id: apple-developer-enterprise-program
    name: Apple Developer Enterprise Program
    type: enterprise
    price: '299.00'
    currency: USD
    billing_period: year
    url: https://developer.apple.com/programs/enterprise/
    description: >-
      For organizations that need private, in-house distribution to their own employees
      through MDM or internal systems rather than the App Store.
    limits: []
free_of_charge:
  - Safari browser on macOS, iOS, iPadOS and visionOS
  - Safari Technology Preview
  - Safari MCP server (bundled with Safari 27 beta / Safari Technology Preview 247)
  - safaridriver / W3C WebDriver automation
  - Web Push via the Apple push service
  - WebKit developer documentation and Web Inspector
