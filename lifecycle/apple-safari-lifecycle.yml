deprecation_policy:
  published: false
  detail: >-
    No dedicated Safari or WebKit API deprecation policy is published, and no Sunset or
    Deprecation response headers (RFC 8594) are documented on any Safari surface. The
    Safari 26.6 release notes carry no Deprecations section. WebKit does publish a
    Feature Policy and per-specification standards positions, but those govern what gets
    implemented, not how implemented API is retired. Recorded as absent rather than
    inferred.
  checked: '2026-09-07'
