versioning:
  scheme: product version, not URL or header
  detail: >-
    Safari APIs version with the browser release. Apple publishes release notes per
    Safari version (currently Safari 26.0 through 26.6, plus Safari 27 Beta) and runs a
    separate Safari Technology Preview train shipping roughly every two weeks (STP 237
    through STP 251 during 2026). Apple Pay JS carries an additional integer API version
    — features such as ApplePayError and the phoneticName contact field require Apple Pay
    API version 3 or later.
  current:
    stable: Safari 26.6
    beta: Safari 27 Beta
    preview: Safari Technology Preview 251
  release_notes: https://developer.apple.com/documentation/safari-release-notes
