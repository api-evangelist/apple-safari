    category: interaction
  - name: screenshot
    description: Capture a screenshot of the current page as a PNG
    category: content
  - name: set_emulated_media
    description: Emulate a CSS media type (e.g. "print") for responsive-design testing
    category: environment
  - name: set_viewport_size
    description: Set the browser viewport size in CSS pixels
    category: environment
  - name: switch_tab
    description: Switch to a different browser tab by its handle
    category: tabs
  - name: wait_for_navigation
    description: Wait for the current page to finish loading; returns final URL and title
    category: navigation
tool_schemas:
  available: false
  note: >-
    Tool names and descriptions are transcribed verbatim from the WebKit announcement's
    tool table. Full inputSchema for each tool was not captured: the server is
    stdio-only and reachable only from a machine with Safari 27 beta or Safari
    Technology Preview installed, so `tools/list` could not be called from this
    pipeline. Introspecting a local install would yield the real schemas.
