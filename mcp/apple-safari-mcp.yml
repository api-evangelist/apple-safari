    description: Create a new browser tab, optionally loading a URL
    category: tabs
  - name: evaluate_javascript
    description: Execute JavaScript code within the page and return the result
    category: scripting
  - name: get_network_request
    description: Get full detail for a single recorded network request (headers, body, timing)
    category: network
  - name: get_page_content
    description: Extract text content of a page in various formats (markdown, HTML, JSON, etc.)
    category: content
  - name: list_network_requests
    description: List network request summaries (URL, method, status, timing) for the current tab
    category: network
  - name: list_tabs
    description: List all open browser tabs with their handles and URLs
    category: tabs
  - name: navigate_to_url
    description: Navigate to a URL and return the loaded page's content
    category: navigation
  - name: page_info
    description: 'Get info about the current page: URL, title, and loading state'
    category: content
  - name: page_interactions
