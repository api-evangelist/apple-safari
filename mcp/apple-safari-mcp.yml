source: https://webkit.org/blog/18136/introducing-the-safari-mcp-server-for-web-developers/
specification: API Commons MCP Server
specificationVersion: '0.1'
provider: Apple Safari
providerId: apple-safari
name: Safari MCP server
description: >-
  Apple's first-party Model Context Protocol server for web developers, introduced by
  WebKit in Safari 27 beta and Safari Technology Preview 247. It connects an
  MCP-compatible agent to a live Safari browser window so the agent can navigate, read
  the DOM, evaluate JavaScript, capture screenshots, inspect network requests and read
  console output. It is shipped inside Safari itself: the server is started by running
  the bundled `safaridriver` binary with the `--mcp` flag, so there is no hosted
  endpoint and no package to install from a registry.
status: published
ownership:
  note: >-
    First-party. Announced on webkit.org, the WebKit Open Source Project site Apple
    maintains for Safari's engine, and implemented in the `safaridriver` binary that
    ships inside Safari and Safari Technology Preview. Unrelated third-party projects
    also publish an MCP server named "safari-mcp"; none of those are recorded here.
  evidence: https://webkit.org/blog/18136/introducing-the-safari-mcp-server-for-web-developers/
deployment:
  mode: local-stdio
  install: claude mcp add safari-mcp -- "/usr/bin/safaridriver" --mcp
  package: bundled with Safari 27 beta and Safari Technology Preview 247 — no registry package
  auth: none
  verified: searched
  note: >-
    No remote endpoint exists. The server runs on the developer's own machine over
    stdio against a locally installed Safari, and the WebKit post publishes no HTTPS
    URL an MCP client could POST to.
requirements:
  - Safari 27 beta, or Safari Technology Preview 247 or later
  - 'Safari > Settings > Advanced > Show features for web developers'
  - 'Safari > Settings > Developer > Allow remote automation and external agents'
install_commands:
  - client: Claude Code
    target: Safari 27 beta
    command: claude mcp add safari-mcp -- "/usr/bin/safaridriver" --mcp
  - client: Claude Code
    target: Safari Technology Preview
    command: claude mcp add safari-mcp-stp -- "/Applications/Safari Technology Preview.app/Contents/MacOS/safaridriver" --mcp
  - client: Codex
    target: Safari 27 beta
    command: codex mcp add safari-mcp -- "/usr/bin/safaridriver" --mcp
  - client: Codex
    target: Safari Technology Preview
    command: codex mcp add safari-mcp-stp -- "/Applications/Safari Technology Preview.app/Contents/MacOS/safaridriver" --mcp
config_example:
  file: mcp.json
  content: |
    {
      "mcpServers": {
        "safari-mcp": {
          "command": "/usr/bin/safaridriver",
          "args": ["--mcp"]
        }
      }
    }
tool_count: 17
tools:
  - name: browser_console_messages
